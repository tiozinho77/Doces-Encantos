<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel PDV - Gestão de Pedidos</title>
    <link rel="stylesheet" href="pdv.css">
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <header class="pdv-header">
        <div>
            <h1>🖥️ Gestor de Pedidos & PDV</h1>
            <span class="status-badge" id="realtime-status">🔴 Conectando ao Banco...</span>
        </div>
        <button class="sound-btn" id="btn-som" onclick="ativarSom()">🔔 Ativar Alerta Sonoro</button>
    </header>

    <!-- Quadro Kanban de Pedidos -->
    <main class="kanban-board">
        
        <!-- Coluna 1: Novos Pedidos -->
        <div class="kanban-column column-pendente">
            <div class="column-header">
                <h2>🟡 Novos Pedidos</h2>
                <span class="badge-count" id="count-pendente">0</span>
            </div>
            <div class="cards-container" id="container-PENDENTE"></div>
        </div>

        <!-- Coluna 2: Em Preparo -->
        <div class="kanban-column column-preparando">
            <div class="column-header">
                <h2>🟠 Em Preparo</h2>
                <span class="badge-count" id="count-preparando">0</span>
            </div>
            <div class="cards-container" id="container-PREPARANDO"></div>
        </div>

        <!-- Coluna 3: Saiu para Entrega / Pronto -->
        <div class="kanban-column column-caminho">
            <div class="column-header">
                <h2>🔵 A Caminho / Pronto</h2>
                <span class="badge-count" id="count-caminho">0</span>
            </div>
            <div class="cards-container" id="container-A_CAMINHO"></div>
        </div>

        <!-- Coluna 4: Concluídos -->
        <div class="kanban-column column-concluido">
            <div class="column-header">
                <h2>🟢 Concluídos</h2>
                <span class="badge-count" id="count-concluido">0</span>
            </div>
            <div class="cards-container" id="container-CONCLUIDO"></div>
        </div>

    </main>

    <script src="pdv.js"></script>
</body>
</html>
